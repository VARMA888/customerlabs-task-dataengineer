# This file defines the data quality tests for our staging layer. 
# By enforcing unique and not-null constraints on critical fields like event_id 
# and user_pseudo_id, it acts as a safeguard to catch bad data early and prevent 
# it from breaking the final attribution dashboard.

version: 2

models:
  - name: stg_ga4_events
    description: "Staging model flattening raw nested GA4 data."
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: user_pseudo_id
        tests:
          - not_null